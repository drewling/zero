server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # The install one-liner on the homepage points here. Serve it as plain text so
    # it renders in a browser (people are invited to read it before piping it into
    # bash) instead of downloading as an unnamed binary blob.
    location = /install {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
