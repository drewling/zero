server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---------------------------------------------------------------------
    # The install one-liner:  curl -fsSL https://zero.headless.com/install | bash
    #
    # This redirects to the script in the repo rather than serving a copy baked
    # into this image. That means the branded URL is permanent but never stale:
    # an installer fix reaches people as soon as it lands on master, with no site
    # redeploy. It is the same approach rustup and bun take, and it keeps
    # macapp/install-zero.sh as the single source of truth.
    #
    # 302 rather than 301 so the target can be repointed later (e.g. at a release
    # asset) without browsers and proxies having cached it forever.
    #
    # curl follows this because -fsSL includes -L.
    #
    # Integrity of the thing actually installed does NOT depend on this hop: the
    # script verifies the DMG against the sha256 published with each release.
    # ---------------------------------------------------------------------
    location = /install {
        return 302 https://raw.githubusercontent.com/drewling/zero/master/macapp/install-zero.sh;
    }

    # Same script, but rendered in the browser for anyone who wants to read it
    # before piping it into a shell. We ask people to do that, so it should be
    # one obvious click.
    location = /install.sh {
        return 302 https://github.com/drewling/zero/blob/master/macapp/install-zero.sh;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
