<!doctype html>
<!-- Review harness only. Three 390px-wide same-origin frames: first viewport, the rules section and install.
     This is iframe width, not device emulation (no mobile UA, touch or DPR change). Usage: phones.html?a-first-light.html -->
<meta charset="utf-8">
<title>390 harness</title>
<style>
html,body{margin:0;background:#2b2b2e;font:12px/1.4 ui-monospace,monospace;color:#ccc}
.row{display:flex;gap:28px;justify-content:center;padding:14px}
figure{margin:0}
iframe{display:block;width:390px;height:780px;border:0;background:#fff;border-radius:18px}
figcaption{padding:6px 4px 0}
</style>
<div class="row" id="r"></div>
<script>
const q = decodeURIComponent(location.search.slice(1) || 'a-first-light.html');
const [page, extra] = q.split('&');
const add = extra ? '?' + extra : '';
for (const [hash, label] of [['', 'first viewport'], ['#sort', 'rules section'], ['#install', 'install']]) {
  const fig = document.createElement('figure');
  const f = document.createElement('iframe');
  f.src = page + add + hash;
  f.title = label;
  fig.append(f);
  const cap = document.createElement('figcaption');
  fig.append(cap);
  f.addEventListener('load', () => setTimeout(() => {
    const d = f.contentDocument.documentElement;
    cap.textContent = `${label} · 390 iframe · scrollWidth ${d.scrollWidth}`;
  }, 1200));
  document.getElementById('r').append(fig);
}
</script>
